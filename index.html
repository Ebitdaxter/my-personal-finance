const TYPES=['OpEx','Income','OpEx - IB','Income - IB'];
function exportCSV(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const H=['Date','SP Month','GL Account','Account Name','Grouping_1','Grouping_2','Type','Description','Amount','Bank Account','Spread Months','Spread Start','Non-cash'];
  const rows=DB.txns.slice().sort((a,b)=>a.date.localeCompare(b.date));
  download(`bilancio-transazioni-${todayStr()}.csv`,'\ufeff'+[H.join(',')].concat(rows.map(t=>{const a=M.A.get(t.gl)||{};return [t.date,t.sp,t.gl,a.name,a.group,a.macro,a.type,t.desc,t.amt,t.bank,t.spread?.months||'',t.spread?.start||'',t.cashless?'Y':''].map(q).join(',')})).join('\n'),'text/csv');toast(`CSV con ${NF0.format(rows.length)} transazioni scaricato`)}
function openSettings(){
  const used=new Map();DB.txns.forEach(t=>used.set(t.gl,(used.get(t.gl)||0)+1));
  const s=modal(`<div class="mhead"><h3>Impostazioni</h3><button class="ibtn" data-close><i class="ph ph-x"></i></button></div><div class="mbody">
   <div class="set-sec"><h3>Account</h3><div class="sub">Modifica direttamente nella tabella: ogni modifica si salva subito. Cambiare il numero aggiorna anche i movimenti collegati.</div>
     <div class="acc-tbl" id="accT"><div class="acc-r"><span>N.</span><span>Nome account</span><span>Gruppo</span><span class="hm">Macro</span><span class="hm">Tipo</span><span></span></div>
     ${DB.accounts.slice().sort((a,b)=>a.n-b.n).map(a=>`<div class="acc-r" data-n="${a.n}" style="--c:${M.gcol.get(a.group)}"><input class="in num" data-k="n" value="${a.n}" inputmode="numeric"><input class="in" data-k="name" value="${esc(a.name)}"><input class="in" data-k="group" list="dl-group" value="${esc(a.group)}" style="border-left:3px solid var(--c)"><input class="in hm" data-k="macro" list="dl-macro" value="${esc(a.macro)}"><select class="in hm" data-k="type">${TYPES.map(t=>`<option ${t===a.type?'selected':''}>${t}</option>`).join('')}</select><button class="ibtn" data-delacc="${a.n}" title="${used.get(a.n)?used.get(a.n)+' movimenti: non eliminabile':'Elimina'}" ${used.get(a.n)?'disabled style="opacity:.25"':''}><i class="ph ph-trash"></i></button></div>`).join('')}</div>
     <div class="set-row"><div class="field" style="flex:1.3"><label>Nuovo account</label><input class="in" id="cN" placeholder="es. Gym membership"></div><div class="field" style="flex:1"><label>Gruppo</label><input class="in" id="cG" list="dl-group" placeholder="es. Selfcare"></div><div class="field"><label>Tipo</label><select class="in" id="cT">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><button class="btn primary sm" id="cAdd">Aggiungi</button></div></div>
   <div class="set-sec"><h3>Obiettivo di risparmio</h3><div class="set-row"><div class="field" style="width:140px"><label>Tasso target %</label><input class="in num" id="tgt" inputmode="decimal" value="${Math.round(DB.target*100)}"></div></div></div>
   <div class="set-sec"><h3>Conti</h3><div class="sub">Rinomina, cambia i colori o chiudi un conto. Un conto chiuso resta nello storico ma non è più selezionabile nei nuovi movimenti.</div>
     <div class="acc-tbl" id="bnkT"><div class="bk-r"><span>Nome</span><span>Anteprima</span><span>Sfondo</span><span>Testo</span><span></span></div>
     ${DB.banks.map(b=>{const i=bInfo(b);return `<div class="bk-r ${i.closed?'closed':''}" data-b="${esc(b)}"><input class="in" data-k="name" value="${esc(b)}">${bankB(b)}<input type="color" data-k="bg" value="${i.bg}" aria-label="Colore sfondo"><input type="color" data-k="fg" value="${i.fg}" aria-label="Colore testo"><button class="btn ghost sm" data-k="close">${i.closed?'Riapri':'Chiudi'}</button></div>`}).join('')}</div>
     <div class="set-row"><div class="field" style="flex:1"><label>Nuovo conto</label><input class="in" id="bN" placeholder="es. Fineco"></div><button class="btn primary sm" id="bAdd">Aggiungi</button></div></div>
   <div class="set-sec"><h3>Azioni suggerite</h3><div class="sub">Gruppi esclusi dalle azioni perché non discrezionali (evidenziati).</div>
     <div class="set-row">${[...new Set(DB.accounts.filter(a=>a.type==='OpEx').map(a=>a.group))].map(g=>`<button class="btn sm ${(DB.noAct||[]).includes(g)?'primary':'ghost'}" data-noact="${esc(g)}">${esc(g)}</button>`).join('')}</div></div>
   <div class="set-sec"><h3>Sincronizzazione GitHub</h3>${GH.cfg?`<div class="sub">Collegato a <b>${esc(GH.cfg.owner)}/${esc(GH.cfg.repo)}</b>${GH.last?' · ultima sincronizzazione '+GH.last.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}${GH.state==='error'?` · <span class="down">${esc(GH.err)}</span>`:''}</div><div class="set-row"><button class="btn primary sm" id="ghNow"><i class="ph ph-arrows-clockwise"></i>Sincronizza ora</button><button class="btn danger sm" id="ghOff">Scollega questo dispositivo</button></div>`:`<div class="sub">Collega un repository GitHub privato per avere gli stessi dati su PC e iPhone.</div>${ghForm()}`}</div>
   <div class="set-sec"><h3>Dati</h3><div class="sub">${FS.state==='ok'?`Salvataggio automatico attivo su <b>${esc(FS.handle.name)}</b>.`:'Salvataggio automatico su file non attivo: i dati sono solo in questo browser.'}</div>
     <div class="set-row"><button class="btn ${FS.state==='ok'?'ghost':'primary'} sm" id="fsSet"><i class="ph ph-floppy-disk"></i>${FS.state==='ok'?'Cambia file dati':'Collega file dati'}</button></div>
     <div class="set-row"><button class="btn primary sm" id="exJ"><i class="ph ph-download-simple"></i>Backup JSON</button><button class="btn ghost sm" id="exC"><i class="ph ph-microsoft-excel-logo"></i>Esporta CSV</button><label class="btn ghost sm" style="cursor:pointer"><i class="ph ph-upload-simple"></i>Importa backup<input type="file" accept=".json" id="imJ" hidden></label></div></div>
   <div class="set-sec" ${document.getElementById('seed').textContent.trim()==='null'?'hidden':''}><h3>Ripristino</h3><div class="sub">Torna ai dati importati dall'Excel. Le modifiche fatte qui andranno perse.</div><div class="set-row"><button class="btn danger sm" id="rst">Ripristina dati Excel</button></div></div>
  </div>`,'mid');
  modalOnClose=()=>render();
  s.querySelector('#accT').addEventListener('change',e=>{
    const row=e.target.closest('[data-n]'),k=e.target.dataset.k;if(!row||!k)return;const n=+row.dataset.n,a=DB.accounts.find(x=>x.n===n);let v=e.target.value.trim();
    if(k==='n'){const nn=+v;if(!nn||(nn!==n&&DB.accounts.some(x=>x.n===nn))){toast('Numero non valido o già usato');e.target.value=n;return}if(nn===n)return;DB.txns.forEach(t=>{if(t.gl===n){t.gl=nn;t.u=nowISO()}});a.n=nn;row.dataset.n=nn;persist();compute();toast(`Account ${n} rinumerato in ${nn}`);return}
    if(!v){e.target.value=a[k];return}
    if(k==='name'&&DB.accounts.some(x=>x!==a&&x.name.toLowerCase()===v.toLowerCase())){toast('Esiste già un account con questo nome');e.target.value=a.name;return}
    if(k==='group'&&v!==a.group){const ex=DB.accounts.find(x=>x.group===v);if(ex){a.macro=ex.macro;const mi=row.querySelector('[data-k=macro]');if(mi)mi.value=ex.macro}}
    a[k]=v;persist();compute();toast('Account aggiornato')});
  s.querySelectorAll('[data-delacc]').forEach(b=>b.onclick=()=>{const n=+b.dataset.delacc;const i=DB.accounts.findIndex(a=>a.n===n);const old=DB.accounts[i];DB.accounts.splice(i,1);persist();compute();openSettings();toast(`Account ${n} eliminato`,()=>{DB.accounts.splice(i,0,old);persist();compute();openSettings()})});
  s.querySelector('#cAdd').onclick=()=>{const n=$('#cN').value.trim(),g=$('#cG').value.trim(),t=$('#cT').value;if(!n||!g){toast('Nome e gruppo sono obbligatori');return}
    if(byName(n)){toast('Esiste già un account con questo nome');return}
    const ex=DB.accounts.find(a=>a.group===g);const base=isInc(t)?3000:2000;const num=Math.max(base,...DB.accounts.filter(a=>a.n>=base&&a.n<base+1000).map(a=>a.n))+1;
    DB.accounts.push({n:num,name:n,type:t,group:g,macro:ex?ex.macro:g});persist();compute();openSettings();toast(`Account ${num} ${n} aggiunto`)};
  s.querySelector('#tgt').onchange=e=>{const v=parseFloat(String(e.target.value).replace(',','.'));if(v>0&&v<100){DB.target=v/100;persist();toast('Obiettivo aggiornato')}};
  s.querySelector('#bAdd').onclick=()=>{const n=$('#bN').value.trim();if(!n||DB.banks.includes(n))return;DB.banks.push(n);migrate();persist();compute();openSettings();toast(`Conto ${n} aggiunto`)};
  const bt=s.querySelector('#bnkT');
  bt.addEventListener('input',e=>{const row=e.target.closest('[data-b]'),k=e.target.dataset.k;if(!row||(k!=='bg'&&k!=='fg'))return;const b=row.dataset.b;bInfo(b);DB.bankInfo[b][k]=e.target.value;const pv=row.querySelector('.bk-b');pv.style.setProperty(k==='bg'?'--bb':'--bf',e.target.value)});
  bt.addEventListener('change',e=>{const row=e.target.closest('[data-b]'),k=e.target.dataset.k;if(!row)return;const b=row.dataset.b;
    if(k==='bg'||k==='fg'){persist();return}
    if(k==='name'){const nn=e.target.value.trim();if(!nn||nn===b)return;if(DB.banks.includes(nn)){toast('Esiste già un conto con questo nome');e.target.value=b;return}
      DB.banks=DB.banks.map(x=>x===b?nn:x);DB.txns.forEach(t=>{if(t.bank===b){t.bank=nn;t.u=nowISO()}});DB.bankInfo[nn]=DB.bankInfo[b];delete DB.bankInfo[b];if(UI.fBank===b)UI.fBank=nn;persist();compute();openSettings();toast(`Conto rinominato in ${nn}`)}});
  bt.addEventListener('click',e=>{const btn=e.target.closest('[data-k=close]');if(!btn)return;const b=btn.closest('[data-b]').dataset.b;const i=DB.bankInfo[b];i.closed=!i.closed;persist();compute();openSettings();toast(i.closed?`Conto ${b} chiuso`:`Conto ${b} riaperto`)});
  s.querySelectorAll('[data-noact]').forEach(x=>x.onclick=()=>{const g=x.dataset.noact;const set=new Set(DB.noAct||[]);set.has(g)?set.delete(g):set.add(g);DB.noAct=[...set];persist();openSettings()});
  s.querySelector('#fsSet').onclick=()=>{if(!FS.supported){fsClick();return}fsDialog()};
  s.querySelector('#exJ').onclick=()=>download(`bilancio-backup-${todayStr()}.json`,JSON.stringify(DB),'application/json');
  s.querySelector('#exC').onclick=exportCSV;
  s.querySelector('#imJ').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{const d=JSON.parse(x);if(!Array.isArray(d.txns)||!Array.isArray(d.accounts))throw 0;const old=DB;DB=d;migrate();modalOnClose=null;closeModal();commit();toast(`Importati ${d.txns.length} movimenti`,()=>{DB=old;commit()})}).catch(()=>toast('File non valido'))};
  bindGhForm(s);const gn=s.querySelector('#ghNow');if(gn)gn.onclick=async()=>{await ghSync(false);openSettings()};
  const go=s.querySelector('#ghOff');if(go)go.onclick=()=>{GH.cfg=null;ghSaveCfg();setGH('off');openSettings();toast('Dispositivo scollegato da GitHub. I dati restano anche in questo browser.')};
  const r=s.querySelector('#rst');r.onclick=()=>{if(r.dataset.ok){const old=DB;DB=JSON.parse(document.getElementById('seed').textContent);migrate();DB.target=old.target;modalOnClose=null;closeModal();commit();toast('Dati ripristinati',()=>{DB=old;commit()})}else{r.dataset.ok=1;r.textContent='Conferma ripristino'}};
}

/* ---------- boot ---------- */
let rzT,rzW=innerWidth;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(Math.abs(innerWidth-rzW)>40&&!document.querySelector('.scrim')){rzW=innerWidth;render()}},200)});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!UI.theme){applyTheme();render()}});
load();if(isMob())UI.tab='home';applyTheme();compute();render();fsChip();if(GH.cfg)ghSync(true);else fsInit();
</script>
</body>
</html>
